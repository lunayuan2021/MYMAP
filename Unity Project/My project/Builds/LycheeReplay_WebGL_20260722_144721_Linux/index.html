    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }
      #unity-container.unity-desktop { position: fixed; inset: 0; left: 0; top: 0; transform: none; width: 100vw; height: 100vh; display: block; overflow: hidden; background: #050505; }
      #unity-canvas { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; display: block; background: #000; }

      #unity-logo { display: none; }
      .lychee-loading-title { color: #e8c36a; font: 700 30px/1.2 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; text-align: center; letter-spacing: 0; }
      .lychee-loading-subtitle { margin-top: 10px; color: #eadfcb; font: 500 15px/1.5 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; text-align: center; }
      #unity-progress-bar-empty { width: 100%; height: 12px; margin-top: 22px; background: rgba(238,213,154,0.18); border: 1px solid rgba(232,195,106,0.5); border-radius: 999px; overflow: hidden; }
      #unity-progress-bar-full { height: 100%; background: linear-gradient(90deg, #a93523, #e8c36a); border-radius: 999px; }
      #lychee-splash { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(8,6,5,0.50), rgba(8,6,5,0.74)), url('lychee_loading_bg.jpg') center/cover no-repeat, radial-gradient(ellipse at 50% 34%, #2a1d12 0%, #120d0a 68%, #050505 100%); transition: opacity 0.55s ease; }
      #lychee-splash .lychee-splash-card { text-align: center; padding: 0 24px; }
      #lychee-splash .lychee-splash-title { color: #e8c36a; font: 800 48px/1.15 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; letter-spacing: 8px; text-shadow: 0 6px 26px rgba(0,0,0,0.62); }
      #lychee-splash .lychee-splash-sub { margin-top: 20px; color: #f3e6c9; font: 600 20px/1.5 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
      #lychee-splash .lychee-splash-en { margin-top: 6px; color: #bca878; font: 500 14px/1.5 'Segoe UI',sans-serif; letter-spacing: 1.5px; }
      #lychee-splash .lychee-splash-hint { margin-top: 4px; color: #9b8a68; font: 500 13px/1.6 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
      #lychee-splash .lychee-splash-track { width: min(360px, 72vw); height: 6px; margin: 28px auto 0; background: rgba(238,213,154,0.16); border-radius: 999px; overflow: hidden; }
      #lychee-splash .lychee-splash-glow { width: 38%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #a93523, #e8c36a); animation: lycheeSlide 1.25s ease-in-out infinite; }
      @keyframes lycheeSlide { 0% { margin-left: -42%; } 100% { margin-left: 104%; } }

  <body>
    <div id="lychee-splash"><div class="lychee-splash-card"><div class="lychee-splash-title">一骑红尘：荔枝争运战</div><div class="lychee-splash-sub">地图资源加载中，请耐心等待</div><div class="lychee-splash-en">Loading map assets, please wait...</div><div class="lychee-splash-hint">首次加载资源较多，请勿关闭页面</div><div class="lychee-splash-track"><div class="lychee-splash-glow"></div></div></div></div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div><div class="lychee-loading-title">一骑红尘：荔枝争运战</div><div class="lychee-loading-subtitle">正在加载游戏资源...<br>Loading game assets...<br>正在准备地图、队伍与事件回放</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">一骑红尘：荔枝争运战</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: rgba(95,24,18,0.92); color: #ffe6b5; padding: 12px 16px; border-radius: 6px;';
        else {
          if (type == 'warning') div.style = 'background: rgba(154,103,33,0.92); color: #fff3cf; padding: 12px 16px; border-radius: 6px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildStamp = "20260722064818";
      var loaderUrl = buildUrl + "/LycheeReplay_WebGL_20260722_144721_Linux.loader.js" + "?v=" + buildStamp;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/LycheeReplay_WebGL_20260722_144721_Linux.data.unityweb" + "?v=" + buildStamp,
        frameworkUrl: buildUrl + "/LycheeReplay_WebGL_20260722_144721_Linux.framework.js.unityweb" + "?v=" + buildStamp,
        codeUrl: buildUrl + "/LycheeReplay_WebGL_20260722_144721_Linux.wasm.unityweb" + "?v=" + buildStamp,
        symbolsUrl: buildUrl + "/LycheeReplay_WebGL_20260722_144721_Linux.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "一骑红尘：荔枝争运战",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      function fitUnityCanvas() {
        var container = document.querySelector("#unity-container");
        var viewport = window.visualViewport;
        var ww = Math.max(1, viewport ? viewport.width : window.innerWidth);
        var wh = Math.max(1, viewport ? viewport.height : window.innerHeight);
        if (container) {
          container.style.position = "fixed";
          container.style.inset = "0";
          container.style.left = "0";
          container.style.top = "0";
          container.style.transform = "none";
          container.style.width = ww + "px";
          container.style.height = wh + "px";
          container.style.display = "block";
          container.style.overflow = "hidden";
        }
        canvas.style.width = ww + "px";
        canvas.style.height = wh + "px";
        canvas.style.maxWidth = "100vw";
        canvas.style.maxHeight = "100vh";
        canvas.style.display = "block";
      }
      window.addEventListener("resize", fitUnityCanvas);
      window.addEventListener("orientationchange", fitUnityCanvas);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fitUnityCanvas);

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        fitUnityCanvas();
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      (function(){
        var suppressedShaders = ['Hidden/CoreSRP/CoreCopy', 'Hidden/Universal Render Pipeline/StencilDitherMaskSeed', 'Hidden/Universal/HDRDebugView'];
        var rawLog = console.log.bind(console);
        var pendingShaderPrefix = false;
        console.log = function(){
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(v){ return String(v); }).join(' ');
          if (msg.trim() === 'ERROR: Shader') { pendingShaderPrefix = true; return; }
          for (var i = 0; i < suppressedShaders.length; i++) { if (msg.indexOf(suppressedShaders[i]) >= 0) { pendingShaderPrefix = false; return; } }
          if (pendingShaderPrefix) { pendingShaderPrefix = false; rawLog('ERROR: Shader '); }
          return rawLog.apply(console, args);
        };
      })();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        window.__lycheeHideSplash = function() { var sp = document.getElementById('lychee-splash'); if (!sp) return; sp.style.opacity = '0'; setTimeout(function(){ if (sp && sp.parentNode) sp.parentNode.removeChild(sp); }, 600); };
        setTimeout(function(){ if (window.__lycheeHideSplash) window.__lycheeHideSplash(); }, 30000);
        var queryParams = new URLSearchParams(window.location.search);
        var requestedDpr = parseFloat(queryParams.get('dpr') || '');
        var qualityMode = (queryParams.get('quality') || '').toLowerCase();
        var renderDpr = Math.min(window.devicePixelRatio || 1, 2);
        if (qualityMode === 'performance' || qualityMode === 'fast') renderDpr = 1;
        if (qualityMode === '4k' || qualityMode === 'uhd') {
          renderDpr = Math.max(renderDpr, Math.min(3, Math.max(
            3840 / Math.max(1, window.innerWidth),
            2160 / Math.max(1, window.innerHeight))));
        }
        if (!isNaN(requestedDpr) && requestedDpr > 0) renderDpr = Math.min(4, Math.max(0.75, requestedDpr));
        config.devicePixelRatio = renderDpr;
        fitUnityCanvas();
        window.__lycheeResumeAudio = function(){ try { var ctx = (typeof WEBAudio !== 'undefined' && WEBAudio && WEBAudio.audioContext) ? WEBAudio.audioContext : null; if (!ctx && typeof Module !== 'undefined' && Module) ctx = Module.webAudioContext || Module.audioContext || null; if (ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume(); } catch(e) {} };
        ['pointerdown','touchstart','keydown'].forEach(function(t){ window.addEventListener(t, window.__lycheeResumeAudio, { passive: true }); });
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
          window.__unityInstance = unityInstance;

                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                console.error(message);
                if (window.__lycheeHideSplash) window.__lycheeHideSplash();
                unityShowBanner('加载失败：请确认通过 HTTP 服务访问完整构建目录，且 Build/StreamingAssets 未缺失。<br>' + message, 'error');
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
